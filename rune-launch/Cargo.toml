[package]
name = "rune-launch"
version = "0.1.0"
edition = "2021"

[dependencies]
rune = { path = "../../rune-src/crates/rune" }
clap = { version = "4.6.7", features = ["derive"] }
emojis = "0.9.1"
nucleo-matcher = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.2.1"
x11rb = { version = "0.13", features = ["randr", "xfixes"] }

# Icon encoding for _NET_WM_ICON → PNG (window list) and freedesktop icon rasterization.
# resvg 0.45 (rune's version) decodes SVGZ without an extra feature.
resvg = { version = "0.45", default-features = false }
# PNG decoding for icon bytes (rune's Pixels has no image decoder).
png = "0.18"
